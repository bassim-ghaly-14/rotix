<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>ROTIX - Ultimate Gaming Experience</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="ROTIX is an exciting next-generation game delivering immersive gameplay, stunning visuals, competitive challenges, and endless entertainment. Join the adventure and experience gaming like never before."
    />

    <meta
      name="keywords"
      content="ROTIX, Rotix Game, Online Game, Mobile Game, Multiplayer, Gaming Platform, Competitive Gaming, Adventure Game, Strategy Game"
    />

    <meta name="author" content="ROTIX Team" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0A1F6D" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://rotixgame.com" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="https://res.cloudinary.com/paihc5qx/image/upload/v1786991414/logo_ba6vg2.png"
    />

    <link
      rel="apple-touch-icon"
      href="https://res.cloudinary.com/paihc5qx/image/upload/v1786991414/logo_ba6vg2.png"
    />

    <!-- Open Graph (Facebook, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ROTIX - Ultimate Gaming Experience" />
    <meta
      property="og:description"
      content="Dive into the world of ROTIX and enjoy a premium gaming experience with epic challenges, immersive gameplay, and endless excitement."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/paihc5qx/image/upload/v1786991414/logo_ba6vg2.png"
    />
    <meta property="og:url" content="https://rotixgame.com" />
    <meta property="og:site_name" content="ROTIX" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROTIX - Ultimate Gaming Experience" />
    <meta
      name="twitter:description"
      content="Experience next-level gaming with ROTIX. Stunning visuals, exciting gameplay, and endless adventures await."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/paihc5qx/image/upload/v1786991414/logo_ba6vg2.png"
    />

    <!-- Mobile App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ROTIX" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Performance -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
